<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ERP · Orders</title>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <aside class="sidebar">
    <div class="brand">
      <strong>ERP</strong>
      <span>Order Management</span>
    </div>
    <nav>
      <a class="nav-item active" href="#orders" data-view="orders">Orders</a>
      <a class="nav-item" href="#integration" data-view="integration">Rafttaar integration</a>
    </nav>
    <div class="sidebar-footer">Phase 2 · Rafttaar</div>
  </aside>

  <main class="main">
    <div id="ordersView">
      <header class="topbar">
        <div>
          <span class="eyebrow">Sales</span>
          <h1>Orders</h1>
        </div>
        <button id="newOrderBtn" class="primary">+ New order</button>
      </header>

      <section class="content">
        <div id="stats" class="stats"></div>

        <section class="card">
          <div class="card-head">
            <div>
              <h2>All orders</h2>
              <p>Orders stored in the ERP database, including those received from Rafttaar.</p>
            </div>
          </div>

          <div class="toolbar">
            <input id="searchInput" type="search" placeholder="Search order, customer or phone...">
            <select id="statusFilter">
              <option value="">All statuses</option>
              <option value="pending">Pending</option>
              <option value="confirmed">Confirmed</option>
              <option value="processing">Processing</option>
              <option value="shipped">Shipped</option>
              <option value="delivered">Delivered</option>
              <option value="cancelled">Cancelled</option>
              <option value="recalled">Recalled</option>
            </select>
            <select id="sourceFilter">
              <option value="">All sources</option>
              <option value="rafttaar">Rafttaar</option>
              <option value="manual">Manual</option>
            </select>
          </div>

          <div id="error" class="alert hidden"></div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Order</th>
                  <th>Customer</th>
                  <th>Items</th>
                  <th>Amount</th>
                  <th>Status</th>
                  <th>Date</th>
                </tr>
              </thead>
              <tbody id="ordersBody"></tbody>
            </table>
          </div>
        </section>
      </section>
    </div>

    <div id="integrationView" class="hidden">
      <header class="topbar">
        <div>
          <span class="eyebrow">Integrations</span>
          <h1>Rafttaar</h1>
        </div>
        <div class="row-gap">
          <button id="itTest" class="secondary">Test connection</button>
          <button id="itPoll" class="primary">Sync now</button>
        </div>
      </header>
      <section class="content" id="integrationBody"><div class="empty">Loading…</div></section>
    </div>
  </main>

  <div id="modal" class="modal hidden">
    <div class="modal-panel">
      <div class="modal-head">
        <div>
          <h2 id="modalTitle">Order details</h2>
          <p id="modalSubtitle">Create and manage an ERP order.</p>
        </div>
        <button id="closeModal" class="icon-button" aria-label="Close">×</button>
      </div>
      <div id="modalBody"></div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="/js/app.js"></script>
  <script src="/js/integration.js"></script>
</body>
</html>
